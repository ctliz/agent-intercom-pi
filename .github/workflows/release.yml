name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org

      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@11.16.0

      - name: Verify tag and package version
        shell: bash
        run: |
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          test "$PACKAGE_NAME" = "@ctliz/pi-intercom"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$RELEASE_SHA" = "$(git rev-parse "$RELEASE_TAG^{}")"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build --if-present

      - name: Publish to npm
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping."
          else
            PUBLISH_TAG="$(node -p "require('./package.json').version.includes('-') ? require('./package.json').version.split('-')[1].split('.')[0] : 'latest'")"
            npm publish --access public --provenance --tag "$PUBLISH_TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; skipping."
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
